    <div class="offcanvas-body d-flex flex-column justify-content-between">
      <ul class="list-unstyled d-flex flex-column gap-2">

        <li>

        <li>

        <li>
          <button
            type="button"

        <li>

        <li>

        </li>
        <li>
          <button
            type="button"

          >
            生產力工具

        </li>
        <li>

            type="button"
            class="btn btn-outline-dark border-none w-100 text-start"
          >
            音樂創作
          </button>
        </li>
      </ul>
      <button type="button" class="btn btn-primary rounded-pill w-100">
        登入/註冊
      </button>

    <main>
      <div class="container">
        <div class="row row-custom">
          <div class="col-md-3">
            <div class="box-custom pt-5 pt-md-6">
              <div class="d-flex d-md-block text-md-center">
                <div class="avatar mb-md-4 mx-4">
                  <img
                    src="/2026wd-week5/assets/avatar-CV3pqSuS.png"
                    alt="avatar"
                    height="64"
                    width="64"
                  />
                </div>
                <div class="content mb-5 mb-md-6">
                  <h2 class="h4 cr-n900">Josh</h2>
                  <p class="fs-body-sm cr-n600">helloworld@gmail.com</p>
                  <p class="badge bg-success fs-body-sm">已驗證</p>
                </div>
              </div>
              <!-- 下方選單區塊 (List Group) -->
              <div class="list-group list-group-flush border-top-0">
                <a
                  href="#"
                  class="list-group-item list-group-item-action active border-0 d-flex align-items-center py-3 px-4"
                >
                  <i class="bi bi-person fs-5 me-3"></i>
                  <span class="fs-body-md">個人資料</span>
                </a>

                <a
                  href="#"
                  class="list-group-item list-group-item-action border-top d-flex align-items-center py-3 px-4 text-dark"
                >
                  <i class="bi bi-laptop fs-5 me-3"></i>
                  <span class="fs-body-md">我上架的 AI 工具</span>
                </a>

                <a
                  href="#"
                  class="list-group-item list-group-item-action border-top d-flex align-items-center py-3 px-4 text-dark"
                >
                  <i class="bi bi-list-task fs-5 me-3"></i>
                  <span class="fs-body-md">我訂閱的 AI 工具</span>
                </a>
              </div>
            </div>
          </div>
          <div class="col-md-9">
            <div class="box-custom p-6">
              <h2 class="h4 cr-n900 fw-bold mb-md-5">基本資料</h2>

              <div class="row">
                <div class="col-md-6">
                  <div class="mb-4 mb-md-5">
                    <label for="fullname" class="form-label">
                      姓名
                      <span class="text-danger">*</span>
                    </label>
                    <input
                      type="text"
                      class="form-control"
                      id="fullname"
                      value="Josh"
                      required
                    />
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="mb-4 mb-md-5">
                    <label for="nickname" class="form-label">暱稱</label>
                    <input
                      type="text"
                      class="form-control"
                      id="nickname"
                      placeholder="請輸入你的暱稱"
                    />
                  </div>
                </div>
              </div>

              <div class="row">
                <div class="col-md-6">
                  <div class="mb-4 mb-md-5">
                    <label for="pickdate" class="form-label">
                      <span class="text-danger">*</span>
                    </label>
                    <input
                      type="text"
                      class="form-control"
                      placeholder="請選擇日期"
                      onfocus="this.type = 'date'"
                      onblur="if (!this.value) this.type = 'text';"
                      required
                    />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="mb-4 mb-md-5">
                    <label for="email" class="form-label">
                      聯絡信箱
                      <span class="text-danger">*</span>
                    </label>
                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      value="helloworld@gmail.com"
                      required
                    />
                  </div>
                </div>
              </div>

              <div class="row">
                <div class="col-md-6">
                  <div class="mb-4 mb-md-5">
                    <label for="tel" class="form-label">
                      連絡電話
                      <span class="text-danger">*</span>
                    </label>
                    <input
                      type="tel"
                      class="form-control"
                      id="tel"
                      value="0912345678"
                      required
                    />
                  </div>
                </div>
              </div>
            </div>
            <div class="box-custom p-6">
              <div class="mb-4 mb-md-5">
                <h2 class="h4 cr-n900 fw-bold">通知設定</h2>
                <p class="fs-body-sm cr-n600">
                  通知將寄送到 helloworld@gmail.com
                  ，如需變更，請至頁面上方的基本資料修改聯絡信箱
                </p>
              </div>

              <div class="mb-4 mb-md-5">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="tool-eval-feedback"
                />
                <label for="tool-eval-feedback" class="form-label">
                  工具評價與回饋
                </label>
                <p class="fs-body-sm cr-n600">即時掌握使用者留下的評價和回饋</p>
              </div>

              <div class="mb-4 mb-md-5">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="ai-trend-tools"
                />
                <label for="ai-trend-tools" class="form-label">
                  AI 趨勢與最新工具
                </label>
                <p class="fs-body-sm cr-n600">推薦適合你的新 AI 工具</p>
              </div>

              <div class="mb-4 mb-md-5">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="tool-update"
                />
                <label for="tool-update" class="form-label">
                  工具功能更新
                </label>
                <p class="fs-body-sm cr-n600">
                  當你訂閱的 AI 工具有新功能或重要更新時，我們會寄信通知你
                </p>
              </div>

              <div class="mb-4 mb-md-5">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="event-offer-info"
                />
                <label for="event-offer-info" class="form-label">
                  活動與優惠資訊
                </label>
                <p class="fs-body-sm cr-n600">把握平台限時優惠與活動資訊</p>
              </div>
            </div>
            <button
              class="btn btn-primary mt-4 mb-5 mt-md-5 mb-md-6 d-block ms-auto rounded-pill px-5 py-2"
              type="submit"
            >
              儲存
            </button>
          </div>
        </div>
      </div>

        <div class="input-group">
          <input
            type="email"
            class="form-control px-4 py-2"
            width="calc(360px + 16px + 16px)"
            placeholder="helloworld@gmail.com"
            aria-label="email"
            aria-describedby="sucscribe-button"
          />
          <button
            class="btn btn-primary px-3"
            type="button"
            id="sucscribe-button"
          >
            訂閱
          </button>
        </div>
      </div>
